<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0072FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002A8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Group -->
  <!-- Adjusted coordinates to form a clear "S" shape composed of two interlocking folded ribbon segments -->
  <g transform="translate(10, 10)">
    <!-- Top Part of S -->
    <!-- Points: TopLeft, TopRight, MidRight, MidLeft -->
    <!-- Creating a shape that looks like the top hook of an S -->
    <path d="M50 10 L130 10 L90 70 L10 50 Z" fill="url(#grad1)" />
    <!-- Adding a facet for 3D effect -->
    <path d="M50 10 L90 70 L50 70 Z" fill="#0095DA" opacity="0.4" />

    <!-- Bottom Part of S -->
    <!-- Points: MidRight, BottomRight, BottomLeft, MidLeft -->
    <!-- Interlocking with the top part, shifted down and right slightly -->
    <!-- Note: To make an S, the bottom part should start "under" the top part's end and sweep left then right -->
    <!-- Actually, let's use the negative space approach which is common -->
    
    <!-- Top Segment (Blue/Cyan) -->
    <!-- From top-left, goes right, then diagonals down-left -->
    <path d="M40 0 L120 0 L80 60 L0 60 Z" fill="url(#grad1)" />
    <!-- Facet -->
    <path d="M40 0 L80 60 L40 60 Z" fill="white" opacity="0.2" />

    <!-- Bottom Segment (Dark Blue) -->
    <!-- Interlocks: diagonals down-right, then bottom bar -->
    <!-- Positioned to create a white "Z" or slash in the middle -->
    <path d="M80 70 L160 70 L120 130 L40 130 Z" fill="url(#grad2)" />
    <!-- Facet -->
    <path d="M80 70 L120 130 L80 130 Z" fill="black" opacity="0.1" />
    
    <!-- Wait, the previous one was 0-120 and 0-130. Overlap was likely due to lack of separation. -->
    <!-- Let's shift them to form the S. -->
    
    <!-- CLEARER S SHAPE ATTEMPT -->
    <!-- Top Arm -->
    <path d="M50 10 L130 10 L100 50 L20 50 Z" fill="url(#grad1)" style="display:none" /> <!-- Ref -->
  </g>

  <!-- Final Geometry Attempt: Two Triangles/Polygons forming S -->
  <g transform="translate(10, 10)">
      <!-- Top Shape: Pointing Right and Down -->
      <!-- (25, 20) -> (105, 20) -> (75, 70) -> (35, 60) -->
      <path d="M30 10 L110 10 L80 65 L20 55 Z" fill="url(#grad1)" />
      <path d="M30 10 L80 65 L40 65 L30 10 Z" fill="#29ABE2" opacity="0.5" /> <!-- Fold -->

      <!-- Bottom Shape: Pointing Left and Up (visually bottom part) -->
      <!-- Needs to be below. -->
      <!-- Top shape ends around Y=65. -->
      <!-- Connect diagonally? -->
      <!-- Let's try to match the whitespace S. -->
      <!-- Bottom Shape -->
      <path d="M60 75 L140 75 L110 130 L30 120 Z" fill="url(#grad2)" />
      <path d="M60 75 L110 130 L70 130 L60 75 Z" fill="#1B1464" opacity="0.3" /> <!-- Fold -->
      
      <!-- The gap between (80,65) and (60,75) creates the break. -->
  </g>

  <!-- Text Group -->
  <g transform="translate(160, 40)">
    <text x="0" y="45" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-weight="bold" font-size="48" fill="#333333">速睿森視</text>
    <text x="5" y="95" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#333333" letter-spacing="1">susense.hk</text>
  </g>
</svg>
